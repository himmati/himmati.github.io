  <h1>هِمتي</h1>
  <p>أذكارك ونقاطك في مكان واحد</p>

  <button id="install" disabled>جاري التجهيز…</button>
  <div class="ok" id="ok">تم التثبيت ✓ تلقين هِمتي في الشاشة الرئيسية</div>
  <a class="btn" id="open" href="./" style="display:none">افتحي هِمتي</a>

  <div class="help" id="android">
    إذا ما ضبط الزر:<br>
    اضغطي <b>⋮</b> فوق ← <b>تثبيت التطبيق</b><br>
    أو <b>إضافة إلى الشاشة الرئيسية</b>
  </div>
  <div class="help" id="ios">
    على الآيفون من <b>Safari</b>:<br>
    اضغطي زر <b>المشاركة</b> تحت ←<br>
    <b>إضافة إلى الشاشة الرئيسية</b> ← <b>إضافة</b>
  </div>
</div>

<script>
var btn=document.getElementById('install'), deferred=null;
var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;

function done(){
  btn.style.display='none';
  document.getElementById('ok').style.display='block';
  document.getElementById('open').style.display='block';
}

if('serviceWorker' in navigator){
  // نفس ملف الـ service worker اللي يستخدمه الموقع (لو اسمه مختلف عدّليه)
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

if(standalone){
  done();
  document.getElementById('ok').textContent='التطبيق مثبت عندك ✓';
}else if(isIOS){
  btn.style.display='none';
  document.getElementById('ios').style.display='block';
}else{
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred=e;
    btn.disabled=false; btn.textContent='تثبيت التطبيق';
  });
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(r){
      if(r.outcome==='accepted') done();
      deferred=null;
    });
  });
  window.addEventListener('appinstalled',done);
  // إذا المتصفح ما عطى زر التثبيت خلال ثواني، نوريها الطريقة اليدوية
  setTimeout(function(){
    if(!deferred&&btn.style.display!=='none'){
      btn.textContent='تثبيت التطبيق';
      document.getElementById('android').style.display='block';
    }
  },4000);
}
</script>
